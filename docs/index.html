<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Üniversite Yemek Verisi</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#0f0c1d; --card:#1a1530; --line:#2c2548; --text:#f1f1f5; --muted:#9a96b0; --acc:#f97316; --ok:#4ade80; --warn:#fbbf24; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 18px; font-size:.88rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .head { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .head h2 { font-size:1rem; margin:0; }
  .pill { font-size:.72rem; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .pill.ok { color:var(--ok); border-color:#22c55e55; } .pill.warn { color:var(--warn); border-color:#fbbf2455; }
  ul { list-style:none; padding:0; margin:10px 0 0; }
  li { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--line); font-size:.9rem; }
  li small { color:var(--muted); }
  .muted { color:var(--muted); font-size:.82rem; margin-top:8px; }
  code { color:var(--acc); font-size:.8rem; word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>Üniversite yemek verisi</h1>
  <p class="lead">GitHub Actions saatte bir günceller. JSON dosyaları herkese açık ve CORS'a açıktır.
    Uygulama: <a href="https://ogrenciyemek.com" style="color:var(--acc)">ogrenciyemek.com</a></p>
  <div id="out"></div>
</main>
<script>
  const SOURCES = [
    { file: "hacettepe-1.json", name: "Hacettepe · Beytepe" },
    { file: "hacettepe-2.json", name: "Hacettepe · Sıhhiye" },
    { file: "anku.json", name: "Ankara Üniversitesi" },
  ];
  const MEALS = { sabah: "Kahvaltı", ogle: "Öğle", aksam: "Akşam", vegan: "Vegan" };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Istanbul" });

  async function card(src) {
    try {
      const res = await fetch(`./data/${src.file}`, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const d = await res.json();
      const day = d.days?.[today];
      const meals = day ? Object.entries(day.meals).filter(([, m]) => m.items?.length) : [];
      const body = meals.length
        ? meals.map(([k, m]) => `<p class="muted">${MEALS[k] || k}${m.time ? " · " + esc(m.time) : ""}${m.totalKcal ? " · " + m.totalKcal + " kcal" : ""}</p>
            <ul>${m.items.map((i) => `<li><span>${esc(i.name)}</span><small>${i.kcal ? i.kcal + " kcal" : esc(i.category || "")}</small></li>`).join("")}</ul>`).join("")
        : `<p class="muted">Bugün (${today}) için menü yok.</p>`;
      const n = Object.keys(d.days || {}).length;
      return `<section class="card"><div class="head"><h2>${esc(src.name)}</h2>
          <span class="pill ${day ? "ok" : "warn"}">${n} gün</span></div>${body}
          <p class="muted">Son değişiklik: ${new Date(d.updated).toLocaleString("tr-TR")}
          ${d.issues?.length ? ` · ${d.issues.length} uyarı` : ""}<br><code>data/${esc(src.file)}</code></p></section>`;
    } catch (e) {
      return `<section class="card"><div class="head"><h2>${esc(src.name)}</h2><span class="pill warn">alınamadı</span></div>
          <p class="muted">${esc(e.message)}</p></section>`;
    }
  }
  Promise.all(SOURCES.map(card)).then((html) => (document.getElementById("out").innerHTML = html.join("")));
</script>
</body>
</html>
